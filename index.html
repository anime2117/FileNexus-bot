<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Share Bot Admin Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .config-section, .status-section {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .file-list {
            margin-top: 20px;
        }
        .file-item {
            background: #fff;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .status-online {
            color: #2ecc71;
            font-weight: bold;
        }
        a {
            color: #3498db;
            text-decoration: none;
            word-break: break-all;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <h2>Secure Surf Zone X - File Share Bot</h2>
    
    <div class="config-section">
        <h3>1. Setup & Configuration</h3>
        <label for="botToken">Telegram Bot Token:</label>
        <input type="text" id="botToken" placeholder="Enter your Bot Token from BotFather">
        
        <label for="dbUrl">Firebase Database URL:</label>
        <input type="text" id="dbUrl" placeholder="https://your-project-default-rtdb.firebaseio.com/">
        
        <button onclick="startBot()">Save & Connect Bot</button>
    </div>

    <div class="status-section">
        <h3>2. Bot Status: <span id="botStatus" style="color: #e74c3c;">Disconnected</span></h3>
        <p>HopWeb-এর মাধ্যমে লাইভ ট্র্যাকিং এবং লং-পোলিং অন আছে। (এই পেজটি চালু রাখতে হবে)</p>
    </div>

    <div class="file-list">
        <h3>3. Stored Files (Realtime Database)</h3>
        <div id="filesContainer">
            <p style="color: #7f8c8d;">No files retrieved yet. Connect Firebase first.</p>
        </div>
    </div>
</div>

<script>
    let database;
    let botToken;
    let lastUpdateId = 0;
    let botUsername = "";

    function startBot() {
        botToken = document.getElementById('botToken').value.trim();
        const dbUrl = document.getElementById('dbUrl').value.trim();

        if (!botToken || !dbUrl) {
            alert('Please fill in both fields!');
            return;
        }

        // Initialize Firebase
        const firebaseConfig = { databaseURL: dbUrl };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        database = firebase.database();

        // Get Bot Info and Start Listening
        fetch(`https://api.telegram.org/bot${botToken}/getMe`)
            .then(res => res.json())
            .then(data => {
                if(data.ok) {
                    botUsername = data.result.username;
                    alert(`Connected successfully to Bot: @${botUsername}`);
                    
                    document.getElementById('botStatus').innerText = "Online & Syncing";
                    document.getElementById('botStatus').className = "status-online";
                    
                    // Start checking for new messages (Long Polling)
                    checkNewMessages();
                    // Load files from DB
                    listenToDatabase();
                } else {
                    alert('Invalid Telegram Bot Token!');
                }
            })
            .catch(err => {
                console.error("Error connecting to Telegram:", err);
                alert("Connection error! Check your network or token.");
            });
    }

    // Database থেকে ফাইল রিড করে প্যানেলে দেখানোর ফাংশন
    function listenToDatabase() {
        const filesRef = database.ref('files');
        filesRef.on('value', (snapshot) => {
            const container = document.getElementById('filesContainer');
            container.innerHTML = '';
            
            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach(key => {
                    const file = data[key];
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    
                    // ইউজারের জন্য ডাইরেক্ট স্টার্ট লিঙ্ক তৈরি
                    const downloadLink = `https://t.me/${botUsername}?start=${key}`;

                    item.innerHTML = `
                        <div><strong>Unique Database ID (Key):</strong> ${key}</div>
                        <div><strong>User ID:</strong> ${file.user_id}</div>
                        <div><strong>File ID:</strong> ${file.file_id}</div>
                        <div><strong>Caption/Name:</strong> <span style="color: #3498db;">${file.caption || 'No Caption'}</span></div>
                        <div><strong>User Download Link:</strong> <a href="${downloadLink}" target="_blank">${downloadLink}</a></div>
                    `;
                    container.appendChild(item);
                });
            } else {
                container.innerHTML = '<p>No files found in database.</p>';
            }
        });
    }

    // টেলিগ্রাম বট লং-পোলিং (মেসেজ রিসিভ এবং রেসপন্স করার লজিক)
    function checkNewMessages() {
        fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${lastUpdateId + 1}&timeout=30`)
            .then(res => res.json())
            .then(data => {
                if (data.ok && data.result.length > 0) {
                    data.result.forEach(update => {
                        lastUpdateId = update.update_id;
                        handleUpdate(update);
                    });
                }
                // বারবার চেক করতে থাকবে ব্যাকগ্রাউন্ডে
                setTimeout(checkNewMessages, 1000);
            })
            .catch(err => {
                console.error("Polling error:", err);
                setTimeout(checkNewMessages, 3000);
            });
    }

    // মেসেজ প্রোসেস করার মূল ফাংশন
    function handleUpdate(update) {
        if (!update.message) return;

        const chatId = update.message.chat.id;
        const text = update.message.text;

        // ১. ইউজার যদি কোনো ফাইল পাঠায় (Document, Photo, Audio, Video ইত্যাদি)
        let fileId = null;
        let caption = update.message.caption || "Shared File";

        if (update.message.document) {
            fileId = update.message.document.file_id;
            caption = update.message.document.file_name || caption;
        } else if (update.message.photo) {
            // সবচেয়ে বড় সাইজের ছবির আইডি নিবে
            fileId = update.message.photo[update.message.photo.length - 1].file_id;
            caption = "Photo File";
        } else if (update.message.video) {
            fileId = update.message.video.file_id;
            caption = "Video File";
        } else if (update.message.audio) {
            fileId = update.message.audio.file_id;
            caption = update.message.audio.title || "Audio File";
        }

        // ফাইল পেলে ডেটাবেসে সেভ করবে এবং ইউজারকে লিঙ্ক দিবে
        if (fileId) {
            const newFileRef = database.ref('files').push();
            const fileKey = newFileRef.key;

            newFileRef.set({
                user_id: chatId,
                file_id: fileId,
                caption: caption
            }).then(() => {
                const generatedLink = `https://t.me/${botUsername}?start=${fileKey}`;
                sendMessage(chatId, `✅ আপনার ফাইলটি সফলভাবে সেভ হয়েছে!\n\n🔗 আপনার ইউজারদের জন্য ডাউনলোড লিঙ্ক:\n${generatedLink}`);
            });
            return;
        }

        // ২. ইউজার যখন অন্য অ্যাকাউন্ট থেকে স্টার্ট লিঙ্কে ক্লিক করবে (/start key)
        if (text && text.startsWith('/start ')) {
            const fileKey = text.split('/start ')[1];
            
            // Firebase থেকে ফাইলটি খুঁজবে
            database.ref('files/' + fileKey).once('value', (snapshot) => {
                const fileData = snapshot.val();
                if (fileData) {
                    sendMessage(chatId, "⏳ আপনার ফাইলটি পাঠানো হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...");
                    // টেলিগ্রামের নিজস্ব file_id ব্যবহার করে সরাসরি ফাইল পাঠিয়ে দেওয়া
                    sendFileToUser(chatId, fileData.file_id, fileData.caption);
                } else {
                    sendMessage(chatId, "❌ দুঃখিত! এই লিঙ্কের কোনো ফাইল খুঁজে পাওয়া যায়নি।");
                }
            });
        } else if (text === '/start') {
            sendMessage(chatId, "👋 স্বাগতম! যেকোনো ফাইল এখানে পাঠান, আমি আপনাকে একটি শেয়ার করার মতো শর্ট লিঙ্ক তৈরি করে দেব।");
        }
    }

    // মেসেজ পাঠানোর হেল্পার ফাংশন
    function sendMessage(chatId, text) {
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: text })
        });
    }

    // ফাইল ইউজারকে ব্যাক করার হেল্পার ফাংশন
    function sendFileToUser(chatId, fileId, caption) {
        // ফাইলটি আসলে কী ধরণের (ডকুমেন্ট হিসেবে পাঠানোই সবচেয়ে নিরাপদ)
        fetch(`https://api.telegram.org/bot${botToken}/sendDocument`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, document: fileId, caption: caption })
        });
    }
</script>

</body>
</html>
